appId: app.haus.desktop
productName: Haus
icon: build/icon.png
artifactName: Haus-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-*/**
mac:
  category: public.app-category.lifestyle
  identity: '-'
  target:
    - dmg
    - pkg
pkg:
  installLocation: /Applications
  scripts: pkg-scripts
  isRelocatable: false
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowElevation: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Haus
  allowToChangeInstallationDirectory: true
linux:
  category: Utility
  syncDesktopName: true
  maintainer: Haus contributors <noreply@github.com>
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
pacman:
  compression: zstd
  artifactName: Haus-${version}-linux-${arch}.pkg.tar.zst

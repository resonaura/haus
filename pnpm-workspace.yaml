packages:
  - apps/*
  - packages/*
  - packages/gpui/vendor/gpuix/packages/native
  - packages/gpui/vendor/gpuix/packages/react

allowBuilds:
  better-sqlite3: true
  '@parcel/watcher': false
  electron: true
  esbuild: true
  sharp: false
  electron-winstaller: false
  koffi: true
  ssh2: false
  '@serialport/bindings-cpp': true
  '@scarf/scarf': false
  '@swc/core': true
  usocket: false
minimumReleaseAgeExclude:
  - '@homebridge/ciao@1.4.0'
  - '@homebridge/hap-nodejs@2.3.0'
  - '@napi-rs/canvas-android-arm64@1.2.1'
  - '@napi-rs/canvas-darwin-arm64@1.2.1'
  - '@napi-rs/canvas-darwin-x64@1.2.1'
  - '@napi-rs/canvas-linux-arm-gnueabihf@1.2.1'
  - '@napi-rs/canvas-linux-arm64-gnu@1.2.1'
  - '@napi-rs/canvas-linux-arm64-musl@1.2.1'
  - '@napi-rs/canvas-linux-riscv64-gnu@1.2.1'
  - '@napi-rs/canvas-linux-x64-gnu@1.2.1'
  - '@napi-rs/canvas-linux-x64-musl@1.2.1'
  - '@napi-rs/canvas-win32-arm64-msvc@1.2.1'
  - '@napi-rs/canvas-win32-x64-msvc@1.2.1'
  - '@napi-rs/canvas@1.2.1'
overrides:
  'ssh2>cpu-features': '-'
  tar: '^7.5.23'
  'form-data@<2.5.6': '^2.5.6'
  'electron@>=44.0.0 <44.9.1': '^44.11.5'
  '@gpuix/native': 'workspace:*'
  '@gpuix/react': 'workspace:*'

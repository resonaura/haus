packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  '@parcel/watcher': false
  electron: true
  esbuild: true
  sharp: false
  electron-winstaller: false
  koffi: true
  ssh2: false
  '@serialport/bindings-cpp': true
  '@scarf/scarf': false
  '@swc/core': true
minimumReleaseAgeExclude:
  - '@homebridge/ciao@1.4.0'
  - '@homebridge/hap-nodejs@2.3.0'
overrides:
  'ssh2>cpu-features': '-'

[project]
name = "haus"
version = "0.1.0"
description = "Haus — A thoughtful home."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "homeassistant==2024.12.5",
    "numpy>=2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/ha"]
python_files = ["*_test.py", "test_*.py"]

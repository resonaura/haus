name: Build Haus
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install missing media fixture tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: pnpm check
  mobile:
    name: mobile JS (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export production Hermes bundle
        run: pnpm --filter @haus/mobile exec expo export --platform ${{ matrix.platform }} --max-workers 2 --output-dir ${{ runner.temp }}/HausMobile-${{ matrix.platform }}
  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
          - os: windows-11-arm
            platform: win
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.platform == 'win'
        name: Check native HWND and legacy acrylic bridge
        timeout-minutes: 2
        run: pnpm --filter @haus/desktop check:windows-material
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools rpm zstd
      - run: pnpm --filter @haus/desktop package:release --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Haus-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.pkg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.pkg.tar.zst
            release/*.tar.gz
  gpui-preview:
    name: GPUIX preview (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            macho: arm64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos
            arch: x64
            macho: x86_64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: pnpm install --frozen-lockfile
      - name: Build GPUIX workspace dependencies
        run: pnpm exec turbo run build --filter='@haus/desktop^...'
      - if: matrix.platform == 'linux'
        name: Install Linux GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libasound2-dev libfontconfig1-dev libssl-dev libvulkan-dev
      - name: Build vendored GPUI/GPUIX native addon
        run: |
          rust_channel="$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/gpui/manifest.json','utf8')).rustToolchain)")"
          rustup toolchain install "$rust_channel" --profile minimal --target "${{ matrix.rust_target }}"
          if [ "${{ matrix.platform }}" = "macos" ] && [ "${{ matrix.arch }}" = "x64" ]; then
            if [ -d /Applications/Xcode_26.3.app/Contents/Developer ]; then
              export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
            fi
            xcodebuild -version
            if ! xcrun --sdk macosx metal --version; then
              xcodebuild -downloadComponent MetalToolchain
              xcrun --sdk macosx metal --version
            fi
          fi
          pnpm --filter @haus/gpui fork:build
      - name: Check native addon and compile the executable
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_MACHO: ${{ matrix.macho }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          pnpm --filter @haus/desktop exec node --input-type=module -e '
            import assert from "node:assert/strict";
            import { __napiBindingTarget, GpuixRenderer, TestGpuixRenderer } from "@gpuix/native";
            assert.equal(process.arch, process.env.EXPECTED_ARCH);
            assert.equal(__napiBindingTarget, "native");
            assert.equal(typeof TestGpuixRenderer, "function");
            new GpuixRenderer();
          '
          pnpm --filter @haus/desktop build:gpui
          if [ "$TARGET_PLATFORM" = "macos" ]; then
            lipo -archs apps/desktop/out/gpui/haus-preview
            test "$(lipo -archs apps/desktop/out/gpui/haus-preview)" = "$EXPECTED_MACHO"
          else
            file apps/desktop/out/gpui/haus-preview
            file apps/desktop/out/gpui/haus-preview | grep -q "ARM aarch64"
          fi
      - if: matrix.platform == 'macos'
        name: Check the standalone executable and compositor on macOS
        timeout-minutes: 5
        run: |
          executable="$GITHUB_WORKSPACE/apps/desktop/out/gpui/haus-preview"
          metal="$(xcrun swift -e 'import Metal; print(MTLCreateSystemDefaultDevice() == nil ? "unavailable" : "available")')"
          case "$metal" in
            available)
              pnpm --filter @haus/desktop check:gpui:packed "$executable" "$RUNNER_TEMP/gpui-preview.png"
              GPUIX_BACKGROUND=1 pnpm --filter @haus/desktop check:gpui:sidebar
              bun --conditions=development apps/desktop/scripts/gpui/check-compositor.ts
              bun --conditions=development apps/desktop/scripts/gpui/check-scroll.ts
              bun --conditions=development apps/desktop/scripts/gpui/check-community.ts
              echo 'Standalone addon load, native Metal window, compositor, and AppKit sidebar checks passed.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            unavailable)
              pnpm --filter @haus/desktop check:gpui:packed "$executable"
              echo 'Standalone addon load passed. Native window and AppKit sidebar checks require Metal.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo 'Unexpected Metal probe result.' >&2; exit 1 ;;
          esac
      - if: matrix.platform == 'linux'
        name: Check the standalone executable on Linux ARM64
        timeout-minutes: 3
        run: |
          executable="$GITHUB_WORKSPACE/apps/desktop/out/gpui/haus-preview"
          pnpm --filter @haus/desktop check:gpui:packed "$executable"
      - name: Archive GPUIX preview with its executable permissions
        env:
          PREVIEW_PLATFORM: ${{ matrix.platform }}
          PREVIEW_ARCH: ${{ matrix.arch }}
        run: |
          preview_dir="$RUNNER_TEMP/gpui-preview"
          mkdir -p "$preview_dir"
          install -m 755 apps/desktop/out/gpui/haus-preview "$preview_dir/haus-preview"
          cp LICENSE "$preview_dir/"
          cp -R THIRD_PARTY_NOTICES "$preview_dir/"
          install -m 644 packages/gpui/vendor/gpuix/LICENSE \
            "$preview_dir/THIRD_PARTY_NOTICES/GPUIX-Apache-2.0.txt"
          install -m 644 packages/gpui/vendor/gpui/LICENSE-APACHE \
            "$preview_dir/THIRD_PARTY_NOTICES/GPUI-Apache-2.0.txt"
          install -m 644 packages/gpui/vendor/gpui/LICENSE-GPL \
            "$preview_dir/THIRD_PARTY_NOTICES/GPUI-GPL-3.0.txt"
          tar -czf "$RUNNER_TEMP/gpui-preview-$PREVIEW_PLATFORM-$PREVIEW_ARCH.tar.gz" -C "$preview_dir" .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GPUIX-preview-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/gpui-preview-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
      - if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GPUIX-preview-${{ matrix.platform }}-${{ matrix.arch }}-screenshot
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gpui-preview.png
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, mobile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          pattern: Haus-*
          merge-multiple: true
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --title "Haus ${GITHUB_REF_NAME#v}"

name: Build Haus Helper
on:
  push:
    branches: [main]
    tags: ['haus-helper-v*']
    paths:
      - 'apps/helper/**'
      - 'packages/homekit/**'
      - 'packages/media/**'
      - 'packages/kitsune/**'
      - 'packages/bridge/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.dockerignore'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES/**'
      - 'apps/nvr/vision/LICENSE*'
      - 'apps/nvr/vision/NOTICE.md'
      - '.github/workflows/helper.yml'
  pull_request:
    paths:
      - 'apps/helper/**'
      - 'packages/homekit/**'
      - 'packages/media/**'
      - 'packages/kitsune/**'
      - 'packages/bridge/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES/**'
      - 'apps/nvr/vision/LICENSE*'
      - 'apps/nvr/vision/NOTICE.md'
      - '.github/workflows/helper.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haus-helper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install media test dependencies
        timeout-minutes: 15
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:services
      - run: pnpm --filter @haus/homekit test
      - run: npm run check
        working-directory: apps/helper/haus-helper
  image:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read add-on version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/helper/haus-helper/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/helper/haus-helper/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/haus/helper-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/haus/helper-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Haus
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

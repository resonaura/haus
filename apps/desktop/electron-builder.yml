appId: app.haus.desktop
productName: Haus
icon: build/icon.png
artifactName: Haus-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
files:
  - out/**
  - package.json
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-*/**
mac:
  icon: build/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: Use the microphone to speak through a camera when you press Talk.
  category: public.app-category.lifestyle
  identity: '-'
  target:
    - dmg
    - pkg
pkg:
  installLocation: /Applications
  scripts: pkg-scripts
  isRelocatable: false
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowElevation: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Haus
  allowToChangeInstallationDirectory: true
linux:
  executableName: haus
  category: Utility
  syncDesktopName: true
  maintainer: Haus contributors <noreply@github.com>
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - tar.gz
pacman:
  compression: zstd
  artifactName: Haus-${version}-linux-${arch}.pkg.tar.zst
